name: contract-bootstrap
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: packages/contracts/package-lock.json
      - run: npm --prefix packages/contracts ci --ignore-scripts
      - run: npm run check
# Integration owner replaces/extends with full application gates once lanes land.
