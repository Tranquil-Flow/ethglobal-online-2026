<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Mycelium — models on a network of everyday computers</title>
    <link rel="stylesheet" href="/style.css" />
    <!--
      Pre-bundle bootstrap: pick the theme before paint to avoid FOUC, and
      generate the C9a mycelium strand layer procedurally.

      The layer renders in BOTH themes (owner request 2026-09-13: white webs on
      the light UI). It is pure SVG and deterministic — an LCG seeded at 1729 so
      the same strands appear on every reload — and it is skipped entirely under
      prefers-reduced-motion: reduce.
    -->
    <script>
      (function () {
        try {
          var stored = null;
          try { stored = localStorage.getItem("mycelium.theme"); } catch (e) {}
          var prefersDark =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
          var theme =
            stored === "mushroom" || stored === "cream"
              ? stored
              : prefersDark
                ? "mushroom"
                : "cream";
          document.documentElement.dataset.theme = theme;

          var reduced =
            window.matchMedia &&
            window.matchMedia("(prefers-reduced-motion: reduce)").matches;
          if (!reduced) {
            // LCG-based deterministic PRNG so the layer is stable across reloads.
            var seed = 1729;
            function rand() {
              seed = (seed * 1664525 + 1013904223) >>> 0;
              return seed / 0xffffffff;
            }
            function between(a, b) { return a + (b - a) * rand(); }
            function quad(x1, y1, cx1, cy1, cx2, cy2, x2, y2) {
              return "M " + x1 + " " + y1 + " C " + cx1 + " " + cy1 + ", " + cx2 + " " + cy2 + ", " + x2 + " " + y2;
            }
            var W = 1600, H = 1000;
            var nodes = [];
            // Seed a few anchor nodes across the canvas.
            for (var i = 0; i < 9; i++) {
              nodes.push({
                x: between(40, W - 40),
                y: between(40, H - 40),
                r: between(2.4, 4.2),
                bright: rand() < 0.45,
                depth: 0,
              });
            }
            var strands = [];
            function branch(x, y, depth, angle, length) {
              if (depth > 4 || length < 18) return;
              var nx = x + Math.cos(angle) * length;
              var ny = y + Math.sin(angle) * length;
              var cx1 = x + Math.cos(angle - 0.6) * length * 0.4;
              var cy1 = y + Math.sin(angle - 0.6) * length * 0.4;
              var cx2 = nx + Math.cos(angle + 0.7) * length * 0.35;
              var cy2 = ny + Math.sin(angle + 0.7) * length * 0.35;
              var d = quad(x, y, cx1, cy1, cx2, cy2, nx, ny);
              strands.push({
                d: d,
                cls: depth === 0 ? "strand strand--trunk" : "strand strand--branch",
              });
              if (rand() < 0.55) {
                nodes.push({
                  x: nx, y: ny,
                  r: between(1.8, 3.4) * (1 - depth * 0.15),
                  bright: rand() < 0.25,
                  depth: depth,
                });
              }
              var forks = 1 + Math.floor(rand() * 3);
              for (var f = 0; f < forks; f++) {
                branch(nx, ny, depth + 1, angle + between(-1.0, 1.0), length * between(0.45, 0.78));
              }
            }
            for (var n = 0; n < nodes.length; n++) {
              var anchor = nodes[n];
              var arms = 2 + Math.floor(rand() * 3);
              for (var a = 0; a < arms; a++) {
                branch(anchor.x, anchor.y, 0, between(0, Math.PI * 2), between(80, 180));
              }
            }
            // Hard-cap to ~120 strands to honour the <2ms paint budget.
            if (strands.length > 120) strands = strands.slice(0, 120);
            if (nodes.length > 60) nodes = nodes.slice(0, 60);

            var svgParts = [
              '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid slice" aria-hidden="true">'
            ];
            for (var s = 0; s < strands.length; s++) {
              svgParts.push('<path class="' + strands[s].cls + '" d="' + strands[s].d + '"></path>');
            }
            for (var k = 0; k < nodes.length; k++) {
              var nd = nodes[k];
              var cls = nd.bright ? "strand--node strand--node-pulse" : "strand--node";
              svgParts.push(
                '<circle class="' + cls + '" cx="' + nd.x.toFixed(1) + '" cy="' + nd.y.toFixed(1) + '" r="' + nd.r.toFixed(2) + '"></circle>'
              );
            }
            svgParts.push("</svg>");
            var layer = document.createElement("div");
            layer.className = "mycelium-strands";
            layer.setAttribute("aria-hidden", "true");
            layer.style.display = "none"; // shown by app.js after paint
            layer.innerHTML = svgParts.join("");
            // Insert before any other content; app.js shows it after the shell mounts.
            (document.body || document.documentElement).appendChild(layer);
          }
        } catch (e) {
          // Non-fatal: fall back to no strands.
        }
      })();
    </script>
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <noscript>Mycelium needs JavaScript to stream an answer and verify the receipt in your browser.</noscript>
  </body>
</html>
