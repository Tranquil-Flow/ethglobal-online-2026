specVersion: 1.0.0
description: Development-only attributed claims; not proof of execution or payment.
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum/contract
    name: Registry
    network: localhost
    source:
      address: '0x0000000000000000000000000000000000000001'
      abi: Registry
      startBlock: 1
    context:
      chainId:
        type: String
        data: '31337'
      mode:
        type: Int
        data: 0
      publisher:
        type: Bytes
        data: '0x0000000000000000000000000000000000000002'
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - ReceiptClaim
        - AssessmentClaim
        - ProviderCount
        - VerifierOutcomeCount
      abis:
        - name: Registry
          file: ./abis/Registry.json
      eventHandlers:
        - event: ReceiptPublished(indexed bytes32,indexed bytes32,uint8)
          handler: handleReceipt
        - event: AssessmentPublished(indexed bytes32,indexed bytes32,indexed bytes32,bytes32,bytes32,uint8,uint8,string)
          handler: handleAssessment
      file: ./src/mapping.ts
